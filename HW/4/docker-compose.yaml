services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./data.js:/docker-entrypoint-initdb.d/data.js
    environment:
      MONGO_INITDB_DATABASE: hotel_booking
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL:       mongodb://mongodb:27017
      MONGO_DB:        hotel_booking
      SECRET_KEY:      super-secret-key-for-hw4
      PYTHONUNBUFFERED: "1"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
